
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kachi's Kitchen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="Navbar.css">
</head>
<body>

    <header>
        <div class="logo">
            <h2>Kachi's</h2>
        </div>

        <nav>
            <ul>
                <li><a href="#"  class="active">Home</a></li>
                <li><a href="#"  class="active">Menu <i class="fa-solid fa-angle-down"></i></a></li>
                <li><a href="#"  class="active">Orders</a></li>
                <li><a href="#"  class="active">Outlet</a></li>
            </ul>
        </nav>
      
        <div class="search-box">
            
            <input type="text" placeholder="Search food..">

            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>

            <span>1</span>

        </div>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <p class="welcome-text">
                WELCOME TO OUR RESTAURANT
            </p>

            <h1>
                Enjoy Your<br> <span>Delicious Food</span>
            </h1>
            <p class="hero-description"> We prepare delicious meals 100% pure and fresh,hot<br> with love so you would love it even more</p>


            <div class="hero-buttons">
                <a href="#" class="Order-button">Order Now Oh</a>
                <div class="Play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
        </div>

        <div class="hero-burger">
            <div class="burger-card">
            <img src="burger.jpg" alt="Burger">
        </div>
        </div>
